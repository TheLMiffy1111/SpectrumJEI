plugins {
	id "com.crystaelix.loom" version "1.11-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
			includeGroup "dev.emi"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.architectury.dev/"
			}
		}
		filter {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel.cloth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.is-immensely.gay/releases/"
			}
		}
		filter {
			includeGroup "de.dafuqs"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
			}
		}
		filter {
			includeGroup "com.klikli_dev"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ladysnake.org/releases/"
			}
		}
		filter {
			includeGroup "org.ladysnake.cardinal-components-api"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.jamieswhiteshirt.com/libs-release/"
			}
		}
		filter {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://api.modrinth.com/maven/"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.DaFuqs"
			includeGroup "com.github.emilyploszaj"
		}
	}
}

def mcVersion = "1.21.1"
def modName = "SpectrumJEI"
def modId = "spectrumjei"
def specVersion = "21.1"
def vendor = "thelm"

group = "thelm.spectrumjei"
version = "21.1.7"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	mixin.defaultRefmapName = "${modId}.refmap.json"
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Log4j
	implementation "org.apache.logging.log4j:log4j-core:2.24.3"

	// Minecraft
	minecraft "com.mojang:minecraft:1.21.1"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = false
		}
		parchment "org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.17.2"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.5+1.21.1"
	modImplementation "eu.pb4:placeholder-api:2.4.2+1.21"
	modImplementation "com.terraformersmc:modmenu:11.0.3"

	// JEI
	modImplementation("mezz.jei:jei-1.21.1-fabric:19.22.1.316") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:21.1.4"))

	// Spectrum Included Dependencies
	implementation "org.jgrapht:jgrapht-core:1.5.2"
	implementation "org.apfloat:apfloat:1.14.0"
	implementation "org.jheaps:jheaps:0.14"
	modImplementation "maven.modrinth:exclusions-lib:R2vQMUlU"
	modImplementation "de.dafuqs:additionalentityattributes:2.0.0+1.21.1"
	modImplementation "de.dafuqs:arrowhead:1.4.4+1.21.1"
	modImplementation "de.dafuqs:reverb:1.1.0+1.21.1"
	modImplementation "de.dafuqs:fractal:1.3.0+1.21.1"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-api:6.1.2"

	// Spectrum External Dependencies
	modImplementation "de.dafuqs:revelationary:1.3.9+1.21.1"
	modImplementation "dev.architectury:architectury-fabric:13.0.8"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
	modImplementation "dev.emi:trinkets:3.10.0"
	implementation "org.commonmark:commonmark:0.25.0"
	implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.25.0"
	implementation "org.commonmark:commonmark-ext-ins:0.25.0"
	implementation "me.zeroeightsix:fiber:0.23.0-2"
	modImplementation("com.klikli_dev:modonomicon-1.21.1-fabric:1.114.5") {transitive = false}
	modImplementation "maven.modrinth:dcwa:W0E7l3pF"

	// Spectrum
	modImplementation "maven.modrinth:spectrum:cl32FO9p"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1258607"
		minecraftVersions.add(mcVersion)
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "8FtYXJhp"
		minecraftVersions.add(mcVersion)
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}
}
