plugins {
	id "com.crystaelix.loom" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
			includeGroup "dev.emi"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
			includeGroup "thelm.fractaljei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.architectury.dev/"
			}
		}
		filter {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel.cloth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.is-immensely.gay/releases/"
			}
		}
		filter {
			includeGroup "de.dafuqs"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
			}
		}
		filter {
			includeGroup "com.klikli_dev"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ladysnake.org/releases/"
			}
		}
		filter {
			includeGroup "dev.onyxstudios.cardinal-components-api"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.jamieswhiteshirt.com/libs-release/"
			}
		}
		filter {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://api.modrinth.com/maven/"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.DaFuqs"
			includeGroup "com.github.emilyploszaj"
		}
	}
}

def mcVersion = "1.20.1"
def modName = "SpectrumJEI"
def modId = "spectrumjei"
def specVersion = "20.1"
def vendor = "thelm"

group = "thelm.spectrumjei"
version = "20.1.9.1"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.20.1"
	mappings loom.layered {
		mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
		parchment "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.19.3"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.11+1.20.1"
	modImplementation "eu.pb4:placeholder-api:2.1.4+1.20.1"
	modImplementation "com.terraformersmc:modmenu:7.2.2"

	// JEI
	modImplementation("mezz.jei:jei-1.20.1-fabric:15.49.0.193") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:20.1.7"))

	// Spectrum Included Dependencies
	implementation "org.jgrapht:jgrapht-core:1.5.2"
	implementation "org.jheaps:jheaps:0.14"
	modImplementation "maven.modrinth:additionalentityattributes:w03ppuef"
	modImplementation "com.github.DaFuqs:Arrowhead:797635e3"
	modImplementation "com.github.DaFuqs:DimensionalReverb:26b08229"
	modImplementation "maven.modrinth:fractal-lib:rBFEjAiy"
	modImplementation "de.dafuqs:Matchbooks:0.1.0"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:5.2.3"
	modImplementation "com.github.emilyploszaj:step-height-entity-attribute:1.2.0"
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:2.4.0"

	// Spectrum External Dependencies
	modImplementation "maven.modrinth:revelationary:SGmfdrZ1"
	modImplementation "dev.architectury:architectury-fabric:9.2.14"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.136"
	modImplementation "dev.emi:trinkets:3.7.2"
	implementation "org.commonmark:commonmark:0.25.0"
	implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.25.0"
	implementation "org.commonmark:commonmark-ext-ins:0.25.0"
	implementation "me.zeroeightsix:fiber:0.23.0-2"
	modImplementation("com.klikli_dev:modonomicon-1.20.1-fabric:1.79.3") {transitive = false}
	modImplementation "maven.modrinth:dcwa:P23QCBEG"

	// FractalJEI
	include(modImplementation("thelm.fractaljei:FractalJEI-Fabric:2.0.3"))

	// Spectrum
	modImplementation "maven.modrinth:spectrum:mDJAjTuc"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1258607"
		minecraftVersions.add(mcVersion)
		client = true
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "8FtYXJhp"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_ONLY
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}
}
