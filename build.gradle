plugins {
	id "com.crystaelix.loom" version "1.13-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
			includeGroup "dev.emi"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.architectury.dev/"
			}
		}
		filter {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel.cloth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.is-immensely.gay/releases/"
			}
		}
		filter {
			includeGroup "de.dafuqs"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ladysnake.org/releases/"
			}
		}
		filter {
			includeGroup "dev.onyxstudios.cardinal-components-api"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.jamieswhiteshirt.com/libs-release/"
			}
		}
		filter {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://api.modrinth.com/maven/"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.DaFuqs"
			includeGroup "com.github.emilyploszaj"
			includeGroup "com.github.devs-immortal"
		}
	}
}

def mcVersion = "1.19.2"
def modName = "SpectrumJEI"
def modId = "spectrumjei"
def specVersion = "19.2"
def vendor = "thelm"

group = "thelm.spectrumjei"
version = "19.2.5"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	mixin.defaultRefmapName = "${modId}.refmap.json"
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.19.2"
	mappings loom.layered {
		mappings "net.fabricmc:yarn:1.19.2+build.28:v2"
		parchment "org.parchmentmc.data:parchment-1.19.2:2022.11.27@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.17.2"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2"
	modImplementation "eu.pb4:placeholder-api:2.0.0-pre.1+1.19.2"
	modImplementation "com.terraformersmc:modmenu:4.2.0-beta.2"

	// JEI
	modImplementation("mezz.jei:jei-1.19.2-fabric:11.8.1.1034") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:19.2.4"))

	// Spectrum Included Dependencies
	implementation "org.jgrapht:jgrapht-core:1.5.2"
	implementation "org.jheaps:jheaps:0.14"
	modImplementation "maven.modrinth:additionalentityattributes:ht3amcX1"
	modImplementation "com.github.DaFuqs:Arrowhead:d9f258a4"
	modImplementation "com.github.DaFuqs:DimensionalReverb:0a4cd0ae"
	modImplementation "maven.modrinth:fractal-lib:8I3R187M"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:5.0.2"
	modImplementation("com.github.devs-immortal:Incubus-Core:1.9.4") {transitive = false}
	modImplementation "com.github.emilyploszaj:step-height-entity-attribute:1.0.1"
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:2.3.0"

	// Spectrum External Dependencies
	modImplementation "maven.modrinth:revelationary:2d9fuEjc"
	modImplementation "dev.architectury:architectury-fabric:6.6.92"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:8.3.134"
	implementation "me.zeroeightsix:fiber:0.23.0-2"
	modImplementation "vazkii.patchouli:Patchouli:1.19.2-77-FABRIC"
	modImplementation "dev.emi:trinkets:3.4.1"
	modImplementation "maven.modrinth:dcwa:3Zi6jtYW"

	// Spectrum
	modImplementation "maven.modrinth:spectrum:cZcvzTh4"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1258607"
		minecraftVersions.add(mcVersion)
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "8FtYXJhp"
		minecraftVersions.add(mcVersion)
		requires "jei", "spectrum"
		incompatible "roughly-enough-items-hacks", "emi"
	}
}
